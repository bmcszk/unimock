name: Push

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Push tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: [ '1.26', '1.27' ]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0

    - name: Run unit tests
      run: |
        make install-gotestsum
        gotestsum --junitfile unit-tests.xml -- -covermode=atomic -coverprofile=coverage.out ./pkg/... ./internal/...

    - name: Compute coverage (Go 1.27 + master only)
      if: matrix.go-version == '1.27' && github.ref == 'refs/heads/master'
      run: |
        PCT=$(go tool cover -func=coverage.out | awk '/total/ {gsub("%",""); print $3}')
        COLOR=brightgreen; awk -v p="$PCT" 'BEGIN{exit !(p<80)}' && COLOR=green
        awk -v p="$PCT" 'BEGIN{exit !(p<60)}' && COLOR=yellow
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > coverage.json
        echo "coverage=$PCT" >> "$GITHUB_OUTPUT"
      id: cov

    - name: Upload coverage badge artifact
      if: matrix.go-version == '1.27' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-badge
        path: coverage.json

  publish-coverage-badge:
    name: Publish coverage badge
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # update gh-pages badge JSON only
    steps:
      - name: Download badge artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge

      - name: Push badge to gh-pages
        env:
          PCT: ${{ steps.cov.outputs.coverage }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git checkout -B gh-pages origin/gh-pages
          mkdir -p badges
          cp coverage.json badges/coverage.json
          git add badges/coverage.json
          git commit -m "chore(badges): coverage $PCT" --allow-empty
          git push origin gh-pages
