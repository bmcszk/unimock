name: Push

on:
  push:

jobs:
  test:
    name: Push tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26', '1.27' ]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0

    - name: Run unit tests
      run: |
        make install-gotestsum
        gotestsum --junitfile unit-tests.xml -- -covermode=atomic -coverprofile=coverage.out ./pkg/... ./internal/...

    - name: Publish coverage badge (Go 1.27 + master only)
      if: matrix.go-version == '1.27' && github.ref == 'refs/heads/master'
      run: |
        PCT=$(go tool cover -func=coverage.out | awk '/total/ {gsub("%",""); print $3}')
        COLOR=brightgreen; awk -v p="$PCT" 'BEGIN{exit !(p<80)}' && COLOR=green
        awk -v p="$PCT" 'BEGIN{exit !(p<60)}' && COLOR=yellow
        mkdir -p /tmp/badges
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > /tmp/badges/coverage.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin gh-pages --depth=1 2>/dev/null || true
        if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
          git checkout -B gh-pages origin/gh-pages
        else
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
        fi
        mkdir -p badges
        cp /tmp/badges/coverage.json badges/coverage.json
        git add badges/coverage.json
        git commit -m "chore(badges): coverage $PCT%" --allow-empty
        git push origin gh-pages
