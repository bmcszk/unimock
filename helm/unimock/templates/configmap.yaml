apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unimock.fullname" . }}-config
  labels:
    {{- include "unimock.labels" . | nindent 4 }}
data:
  config.yaml: |-
{{- if .Values.config.yaml }}
{{ .Values.config.yaml | indent 4 }}
{{- else }}
{{ toYaml .Values.config | indent 4 }}
{{- end }}
