# Default values for unimock
# This is a YAML-formatted file

# Unimock runs as single instance only (hardcoded to 1 replica)

# Container image configuration
image:
  # GitHub Container Registry
  repository: ghcr.io/bmcszk/unimock
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

# Image pull secrets for private registries
imagePullSecrets: []

# Override names
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}
# Pod labels
podLabels: {}

# Pod security context
podSecurityContext:
  fsGroup: 65534

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: http
  # annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: unimock.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: unimock-tls
  #    hosts:
  #      - unimock.local

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Horizontal Pod Autoscaler (not supported - single replica only)
# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 1
#   targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80

# Environment variables
env:
  UNIMOCK_PORT: "8080"
  UNIMOCK_LOG_LEVEL: "info"
  # UNIMOCK_CONFIG: "/etc/unimock/config.yaml"  # Config file path

# Unimock configuration
# Can be either a YAML object or a string
config:
  # YAML object format (recommended)
  sections:
    users:
      path_pattern: "/api/users/*"
      body_id_paths: ["/id"]
      return_body: true
      strict_path: false
    products:
      path_pattern: "/api/products/*" 
      body_id_paths: ["/id"]
      return_body: true
      strict_path: false
    orders:
      path_pattern: "/api/orders/*"
      body_id_paths: ["/order_id"]
      header_id_names: ["X-Order-ID"]
      return_body: true
      strict_path: false

  # Alternative: Raw YAML string format (unified format, map-style sections)
  # yaml: |
  #   sections:
  #     users:
  #       path_pattern: "/api/users/*"
  #       body_id_paths: ["/id"]
  #   scenarios: []

# Scenarios are part of the unified config above (top-level "scenarios:" key).
# Since v0.0.8+ there is NO separate scenarios file/env: UNIMOCK_SCENARIOS_FILE is
# ignored and a separate scenarios ConfigMap is not mounted. Define scenarios inline:
#
# config:
#   sections:
#     users:
#       path_pattern: "/api/users/*"
#       body_id_paths: ["/id"]
#       return_body: true
#   scenarios:
#     - uuid: "user-not-found"
#       method: "GET"
#       path: "/api/users/999"
#       status_code: 404
#       content_type: "application/json"
#       data: '{"error": "User not found"}'

# Probes configuration
probes:
  liveness:
    enabled: true
    httpGet:
      path: /_uni/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    httpGet:
      path: /_uni/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    httpGet:
      path: /_uni/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}

# Pod Disruption Budget (not needed for single replica)
# podDisruptionBudget:
#   enabled: false
#   minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  # ingress: []
  # egress: []

# Monitoring configuration
monitoring:
  # Enable ServiceMonitor for Prometheus
  serviceMonitor:
    enabled: false
    # namespace: monitoring
    # interval: 30s
    # path: /_uni/metrics
    # labels: {}
    # annotations: {}

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Extra environment variables
extraEnv: []
# - name: CUSTOM_VAR
#   value: "custom-value"

# Extra environment variables from secrets/configmaps
extraEnvFrom: []
# - secretRef:
#     name: unimock-secret
# - configMapRef:
#     name: unimock-config

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Pod restart policy
restartPolicy: Always

# DNS policy
dnsPolicy: ClusterFirst

# Termination grace period
terminationGracePeriodSeconds: 30